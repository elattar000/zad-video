name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: findzip
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted

      - name: Locate Flutter project
        id: locate
        run: |
          PUBSPEC="$(find extracted -name pubspec.yaml | head -n 1)"
          if [ -z "$PUBSPEC" ]; then
            echo "No pubspec.yaml found"
            exit 1
          fi
          DIR="$(dirname "$PUBSPEC")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project found at: $DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android files
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          flutter --version
          flutter create --platforms=android --org com.zadvideo .

      - name: Get packages
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-video-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
